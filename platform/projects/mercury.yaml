# devplat project configuration — Project MERCURY
# Every value is taken from the repository (docs/mercury/** on branch claude/devplatform-k8s, 2026-10-17).
# The source of each value is in the trailing comment or in docs/mercury/development-orchestration/26-project-configuration.md §2.
# Nothing here is a secret value. Unknown values are {unresolved: <question>}; designed-but-absent commands are {planned, ref}.
# Mercury PRODUCTION architecture is not described here: this file only tells devplat how to BUILD Mercury.
schema: devplat.project.v1
schema_minor: 2
project_id: mercury
display_name: Project MERCURY
# onboarding, not active: the TDD is not approved (DOD-01), no package.json/source exists, the ruleset (DOD-02)
# and dev bot (DOD-13) are not in place. Only planning/design/discovery tasks may run (26-… §1.4).
status: onboarding
config_version: 3                 # 2: R6 fix round (hard_preconditions, bucket name, catalogue task kinds); 3: no in-cluster builds (doc 22 O-5)
verified:
  date: "2026-10-17"
  by: devplat drafting agent (Amendment 001), checked by platform/tools/validate_projects.py
  sources:
    - docs/mercury/TDD.md (v1.0-rc1)
    - docs/mercury/architecture/components.md §1, §2
    - docs/mercury/testing/verification-plan.md §2.1, §2.3, §2.5, §3
    - docs/mercury/operations/macos-service.md §1, §15.1
    - docs/mercury/integrations/github.md §9
    - docs/mercury/architecture/decisions/ADR-001, ADR-005, ADR-008, ADR-014
    - docs/mercury/development-orchestration/06-…, 08-…, 09-…, 12-…; tools/devorch/gen_agents.py
    - git remote (origin = https://github.com/usjbro/Project-Mercury); repository tree (no package.json, no .github/)

source_repository:
  url: https://github.com/usjbro/Project-Mercury        # git remote; docs call it usjbro/project-mercury (case only)
  default_branch: main                                  # 14-… §1 (main has 1 commit)
  protected_branches: [main]                            # DOD-02 target; not yet applied
  visibility: public                                    # TDD §4; macos-service §15.1 ("public repo")
  owner_kind: user                                      # personal account -> G-DETECT only (08-… §5)

issue_tracker:
  unresolved: "No Linear project or issue for Mercury exists (discovery 2026-10-17). Backlog lives in planning/issue-breakdown.md (82 MERC issues). Which Linear team/project should hold it, and when (DOD-05)?"
  owner: operator
  blocks: Linear read reconciliation and any Linear write; the DAG comes from data/dag.json until then

documentation:
  requirements: [docs/mercury/planning/traceability.md, docs/mercury/security/threat-model.md]
  design: [docs/mercury/TDD.md, docs/mercury/architecture/components.md, docs/mercury/architecture/state-machine.md, docs/mercury/protocols/messages.md]
  adr: [docs/mercury/architecture/decisions/]
  runbooks: [docs/mercury/operations/recovery.md, docs/mercury/operations/macos-service.md, docs/mercury/development-orchestration/13-runbook.md]
  test_plan: [docs/mercury/testing/verification-plan.md]
  design_approval:
    state: awaiting_operator                            # TDD §32.3 "not approved for implementation"; DOD-01
    ref: docs/mercury/TDD.md §32.3; development-orchestration/12-amendments.md DOD-01

architecture_constraints:
  - docs/mercury/architecture/components.md §2 (layering rules D1–D7)
  - docs/mercury/TDD.md §6 (architecture principles 1–10)
  - docs/mercury/architecture/decisions/ADR-001…ADR-020 (Accepted)
  - docs/mercury/development-orchestration/01-development-architecture.md §1 (separation rules S1–S4)
coding_standards:
  - docs/mercury/architecture/components.md §1 (TypeScript strict, noUncheckedIndexedAccess, ES modules; runtime deps fixed)
  - docs/mercury/architecture/decisions/ADR-001 item 3 (minimal runtime deps; npm ci --ignore-scripts)
  - docs/mercury/development-orchestration/06-worktree-and-branching.md §3 (Conventional Commits + Devorch trailers)

languages:
  - {name: TypeScript, version: "5.x (strict)", ref: components.md §1}
  - {name: Node.js, version: "24 LTS (exact patch pinned; not yet chosen)", ref: components.md §1; ADR-001}
  - {name: SQL (SQLite dialect), version: "node:sqlite (RC in Node 24); fallback better-sqlite3", ref: components.md §1; ADR-002}

toolchains:
  - name: node
    version: {unresolved: "Exact Node 24 LTS patch to pin (ADR-001 item 1 requires an exact pin; none chosen yet).", owner: devops}
    role: runtime and test runner host
    ref: ADR-001
  - {name: typescript, version: "5.x", role: typecheck (tsc --noEmit), ref: components.md §1; macos-service §15.1}
  - {name: ajv, version: "8", role: runtime dependency (schema validation), ref: components.md §1}
  - {name: smol-toml, version: {unresolved: "Pinned version not chosen yet (components.md §1 'pinned')."}, role: runtime dependency (config), ref: components.md §1}
  - {name: "@anthropic-ai/claude-agent-sdk", version: {unresolved: "Exact pin not chosen yet (components.md §1 'exact pin')."}, role: runtime dependency, ref: components.md §1; ADR-004}
  - name: test stack
    version: {unresolved: "components.md §1 lists 'node:test or Vitest' — which one?", owner: lead-architect}
    role: unit/property tests (with fast-check, dependency-cruiser)
    ref: components.md §1
  - {name: codex-cli, version: "0.162.x (pinned at Phase 0)", role: production dependency; used only via FakeCodex in Kubernetes lanes, ref: TDD §4; ADR-005}

container_images:
  - name: mercury-toolchain
    purpose: toolchain
    image: {unresolved: "No image built yet. Needs the pinned Node 24 patch; built in devplat platform CI, not in the cluster (doc 22 §9.1, O-5; builds disabled by default, R6 D20), scanned and pinned by digest.", owner: devops, blocks: every Kubernetes test level}
    platforms: {unresolved: "amd64/arm64 support recorded only after a verified build."}
  - name: mercury-agent
    purpose: agent
    image: {unresolved: "Agent runner image (Claude Code headless + toolchain) not built; built in devplat platform CI (doc 22 O-5); digest recorded after build and scan.", owner: devops}
    platforms: {unresolved: "Recorded per verified build."}

# Mercury test tiers T0–T5 (verification-plan §2.1). No package.json exists, so no command can run yet:
# every command is `planned` with its design reference, or unresolved.
test_levels:
  - id: T0
    name: In-process (unit, state-machine/property)
    environment: k8s-test
    covers: [L1, L2]
    commands:
      build: {planned: "npm ci --ignore-scripts && tsc build", ref: "ADR-001 item 3; macos-service §15.1 build"}
      lint: {planned: "eslint, prettier, markdownlint, actionlint", ref: "macos-service §15.1 lint"}
      typecheck: {planned: "tsc --noEmit (strict)", ref: "macos-service §15.1 typecheck"}
      test: {planned: "test-unit: state machine, admission, credited-time math (FakeClock both modes), redactor, migrations; coverage >= 85 % core/", ref: "macos-service §15.1 test-unit; verification-plan §3 L1/L2"}
      scan: {planned: "secret scan + ID/pointer/parameter lint", ref: "issue-breakdown MERC-030; TC-OPS-009/010"}
      deployment_validation: {not_applicable: "No deployment at T0."}
    fake_results_verify: false
    ref: verification-plan §2.1 T0
  - id: T1
    name: Local integration (SQLite both drivers, git, child processes; fakes for agents/broker/GitHub/Linear)
    environment: k8s-test
    covers: [L3, L4, L9-crash, L11]
    commands:
      build: {planned: "npm ci --ignore-scripts", ref: "ADR-001 item 3"}
      lint: {not_applicable: "Covered at T0."}
      test: {planned: "test-integration and test-contracts (Linux part)", ref: "macos-service §15.1 test-integration, test-contracts"}
      scan: {not_applicable: "Covered at T0."}
      deployment_validation: {not_applicable: "No deployment at T1."}
    fake_results_verify: false
    ref: "verification-plan §2.1 T1 ('CI, macOS runner preferred'); L4 exit requires the macOS runner — see test level T1-mac"
  - id: T1-mac
    name: macOS-specific CI jobs (wrappers, launchd plist lint, same-uid spawn, fullfsync pragma, temporary keychain)
    environment: gh-hosted-macos
    covers: [L4-macos, test-wrappers, test-macos]
    commands:
      build: {planned: "build agent-exec/agent-ctl/helpers", ref: "macos-service §15.1 test-wrappers", runner: macos-15}
      lint: {planned: "plutil -lint; visudo -cf of the rendered drop-in", ref: "macos-service §15.1 test-macos, test-wrappers", runner: macos-15}
      test: {planned: "grammar unit tests and argv fuzzing; same-uid spawn/kill/adoption with a fake agent; caffeinate -w; socket checks", ref: "macos-service §15.1", runner: macos-15}
      scan: {not_applicable: "Covered at T0."}
      deployment_validation: {not_applicable: "Not a deployment."}
    fake_results_verify: false
    ref: "macos-service §15.1 (GitHub-hosted runners only, no self-hosted runner); ASM-F-07"
  - id: T2
    name: E2E simulation (whole daemon + CLI + socket against fakes, FaultProxy, virtual clock)
    environment: k8s-test
    covers: [L5, L7, L8, L10]
    commands:
      build: {planned: "npm ci --ignore-scripts", ref: "ADR-001 item 3"}
      lint: {not_applicable: "Covered at T0."}
      test: {planned: "E2E with fakes, agent failure simulation, network interruption (FaultProxy), duplicate events", ref: "verification-plan §3 L5, L7, L8, L10"}
      scan: {not_applicable: "Covered at T0."}
      deployment_validation: {not_applicable: "No deployment at T2."}
    fake_results_verify: false
    ref: verification-plan §2.1 T2
  - id: T3
    name: Sandbox (real GitHub sandbox repo with production ruleset, Linear sandbox team)
    environment: k8s-sandbox
    covers: [L6, L13, L12-partial, L15-partial]
    commands:
      build: {planned: "npm ci --ignore-scripts", ref: "ADR-001 item 3"}
      lint: {not_applicable: "Covered at T0."}
      test: {planned: "sandbox integration suites behind the test-targets.allow guard", ref: "verification-plan §2.3; TC-OPS-009"}
      scan: {not_applicable: "Covered at T0."}
      deployment_validation: {not_applicable: "Not a deployment."}
    needs_secrets: [mercury-sandbox-bot-key, mercury-sandbox-ops-key, mercury-sandbox-linear-app]
    fake_results_verify: true
    ref: "verification-plan §2.3, §2.5 (ready at P0c exit)"
  - id: T4
    name: Real Mac (launchd, Keychain, Seatbelt, _mercuryagent, sudoers wrappers, presence/power helpers, sleep)
    environment: macos-lane
    covers: [L0, L9-mac, L12, L15]
    commands:
      build: {not_applicable: "Operator-run procedures; the platform schedules mac_validation tasks and imports evidence."}
      lint: {not_applicable: "Operator-run."}
      test: {planned: "Mac procedures prepared as scripts by agents, executed by the operator", ref: "verification-plan §2.1 T4; macos-service §16; recovery.md §6"}
      scan: {not_applicable: "Operator-run."}
      deployment_validation: {planned: "LaunchAgent install/upgrade/rollback demos (operator)", ref: "macos-service §13; TDD §24"}
    fake_results_verify: true
    ref: verification-plan §2.1 T4 ("Operator's Mac only")
  - id: T4v
    name: macOS guest VM power-loss cycles
    environment: macos-vm-lane
    covers: [TC-REC-020]
    commands:
      build: {not_applicable: "Operator-run rig."}
      lint: {not_applicable: "Operator-run rig."}
      test: {planned: "50 forced VM stops; integrity_check ok; no DB reference to a missing git object", ref: "verification-plan §2.1 T4v; macos-service §15.3"}
      scan: {not_applicable: "Operator-run rig."}
      deployment_validation: {not_applicable: "Not a deployment."}
    fake_results_verify: true
    ref: verification-plan §2.1 T4v (never hosted CI, never the operator's own Mac)
  - id: T5
    name: Pilot on network_monitor (production use, not a platform test level)
    environment: macos-lane
    covers: [L17]
    commands:
      build: {not_applicable: "Production pilot; outside devplat."}
      lint: {not_applicable: "Production pilot."}
      test: {not_applicable: "TC-PIL criteria are recorded by the operator as facts."}
      scan: {not_applicable: "Production pilot."}
      deployment_validation: {not_applicable: "Production deployment is the operator's act (TDD §24); devplat never deploys Mercury."}
    fake_results_verify: true
    ref: verification-plan §2.1 T5, §7.3

required_tooling:
  - {name: git, ref: "components.md §9 (hardened git); devorch"}
  - {name: node + npm, version: "24 LTS", ref: ADR-001}
  - {name: actionlint, ref: "macos-service §15.1 lint; 08-… §3 (CI/workflows)"}
  - {name: shellcheck, ref: "08-… §3 (CI / workflows / scripts)"}
  - name: secret scanner
