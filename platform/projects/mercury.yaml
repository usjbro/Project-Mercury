    kind: kubernetes_exec
    purpose: agent Jobs (all 12 roles + planner), no project secrets
    task_kinds: [planning, plan_proposal, design, implementation, test, review, integration]
    ref: "doc 16; namespace proj-mercury-exec"
  - id: k8s-test
    kind: kubernetes_ephemeral_test
    purpose: T0–T2 in ephemeral proj-mercury-t-<runid> namespaces; no credentials; egress none
    task_kinds: [test]
    ref: "verification-plan §2.1 T0–T2; doc 22"
  - id: k8s-sandbox
    kind: kubernetes_ephemeral_test
    purpose: T3 sandbox suites; only namespace that mounts sandbox App/Linear credentials (names only here)
    task_kinds: [test]
    readiness: "P0c exit recorded as operator fact (verification-plan §2.5 T3); sandbox repo and team created by the operator (OD-13)"
    ref: verification-plan §2.3
  - id: gh-hosted-macos
    kind: github_hosted_ci
    purpose: macOS-only CI jobs on GitHub-hosted macos-15 runners (repository CI, not devplat Jobs)
    readiness: "MERC-030 CI live; ASM-F-07 verified (P0d CI spike)"
    ref: "macos-service §15.1; RA-D2"
  - id: macos-lane
    kind: external_lane
    lane: macos
    purpose: T4 real-Mac validation, Phase 0 checks, [ROOT — operator consent] steps
    host: "operator's Mac (MacBook Air M2, 16 GB; 09-… planning constraint)"
    task_kinds: [mac_validation, operator_action]
    requirements: [launchd, login Keychain, Seatbelt, _mercuryagent uid, sudoers wrappers, presence and power helpers]
    readiness: "P0a/P0b results recorded (verification-plan §2.5 T4); G-S1 before any agent run on the Mac (threat-model §8.10)"
    ref: verification-plan §2.1 T4
  - id: macos-vm-lane
    kind: external_lane
    lane: macos-vm
    purpose: T4v power-loss rig
    host: {unresolved: "Which operator-controlled Apple Silicon host runs the tart/UTM guest VM (P0-047)?", owner: operator}
    task_kinds: [mac_validation]
    readiness: "P0-047 passed; rig per macos-service §15.3"
    ref: verification-plan §2.1 T4v

resources:
  default_job: {unresolved: "Per-role requests/limits come from platform/agents/execution-profiles.yaml; no Mercury-specific measurement exists yet. Override needed?", owner: devops}
  namespace_quota: {unresolved: "ResourceQuota for proj-mercury-* not sized; needs the cluster size chosen in DOD-15 and the first 10 measured tasks (09-… §4).", owner: operator}
  max_concurrent:
    jobs: 5                        # 3 implementation + 2 review
    implementation: 3              # 09-… §2 (scenario B; no gain beyond 3)
    review: 2                      # 09-… §2
    external_lane: 1               # 09-… §2 (one operator, one Mac)
    open_prs_awaiting_human: 4     # 09-… §2 (RISK-22)
    ref: development-orchestration/09-resources-and-costs.md §2
  priority_weight: {unresolved: "Fair-share weight vs. other projects (doc 17). Only Mercury is real today."}

network:
  model_providers: [anthropic]     # development agents are Claude Code; Codex runs only as FakeCodex here (contract recording is a Mac-lane suite, verification-plan §2.4)
  classes_allowed: [none, model-only, deps]   # per-role class comes from execution-profiles.yaml, bounded by this list
  registries_allowlist:
    unresolved: "The design requires a registry allowlist (ADR-005 item 7, FR-123) but names no host. Confirm registry.npmjs.org as the only host for development installs. Until resolved the deps class is denied."
    owner: security
    blocks: dependency installation in Jobs (npm ci)
  extra_egress: []

identities:
  github_app:
    name: devplat-github-app-mercury
    purpose: development bot (dev/* pushes, draft PRs) — NOT mercury-bot
    holder: devplat-gitbroker
    scope: "contents:write limited to dev/*, pull_requests:write (draft), no administration/workflows, not a CODEOWNER, no bypass. NOTE: with contents:write + pull_requests:write the App CAN merge and approve through the API; the DOD-02 ruleset (code-owner review, no bypass) is the preventive control (R6 D13)"
    provisioning: awaiting_operator
    ref: 12-amendments.md DOD-13 (replaces DOD-03 (a) in Kubernetes mode); 01-… S1–S2
  secrets:
    - {name: devplat-anthropic-key-mercury, purpose: model API key for Mercury agent Jobs, holder: devplat-model-gateway, scope: "dedicated key with spend limit; injected by the gateway", provisioning: awaiting_operator, ref: "DOD-08; ADR-008 pattern (dedicated key)"}
    - {name: mercury-sandbox-bot-key, purpose: sandbox mercury-bot App private key for T3, holder: test-namespace, scope: "sandbox repo only; separate installation id", provisioning: not_created, ref: "verification-plan §2.3; OD-13"}
    - {name: mercury-sandbox-ops-key, purpose: sandbox mercury-ops App private key for T3, holder: test-namespace, scope: sandbox only, provisioning: not_created, ref: verification-plan §2.3}
    - {name: mercury-sandbox-linear-app, purpose: Linear app (actor=app) credentials for sandbox team MSB, holder: test-namespace, scope: "team MSB only", provisioning: not_created, ref: verification-plan §2.3}

security:
  # Development-time restrictions for agent tasks on this repository (devorch contracts, guard hook, CLAUDE.md).
  restricted_paths:
    # docs/** below is a RECOMMENDED default pending operator decision DOD-23 (not decided); .github/** is required
    # for every non-draft project by CI hardening H8 (R6 D13; validate_projects.py).
    - "docs/**"                      # design changes only by operator-approved amendment (CLAUDE.md; 08-… §2 D7–D8 note)
    - ".github/**"                   # CI, workflows, CODEOWNERS: restricted until the operator decides otherwise (open question Q-M3, 26-… §2.3)
    - ".claude/**"                   # Claude Code config (guard hook PATH_DENY; SEC-310)
    - "CLAUDE.md"
    - ".mcp.json"
    - ".codex/**"
    - ".agents/**"
    - "AGENTS*.md"
    - "tools/devorch/**"             # development control plane
    - "platform/**"                  # devplat itself (ADR-030): never changed by a Mercury task
    - ".git/**"
  security_sensitive_paths:
    - "src/adapters/process/**"      # AgentExecSupervisor (Security Engineer scope)
    - "src/adapters/git/**"
    - "src/adapters/keychain/**"
    - "src/adapters/presence/**"
    - "src/adapters/github/**"       # endpoint allowlist SEC-102, D6
    - "src/core/policies/redaction*"
    - "src/app/decision-recorder.ts" # sole writer of authority records (INV-18)
    - "src/core/guards.ts"
    - "src/adapters/sqlite/migrations/**"   # triggers enforce INV-nn
    - "packaging/agent/**"           # agent-exec/agent-ctl, Seatbelt profiles, sudoers
    - "package.json"                 # supply chain (06-… §4)
    - "package-lock.json"
  escalate_paths:
    - "src/ports/**"                 # frozen interfaces (06-… §4; RA-D3): Lead Architect only, interface_frozen record
  runtime_class: gvisor              # recommended (ADR-023, proposed; awaits DOD-11); repository-derived code is untrusted
  pod_security: restricted
  untrusted_inputs: [agent outputs, repository content, Linear text, PR comments and reviews, CI logs, dependency source, fixtures]   # 08-… §6

agent_permissions:
  roles:
    planner: {enabled: true, writes: false, path_scopes: [], task_kinds: [plan_proposal], ref: "Principal Orchestrator reasoning as planner Jobs; proposals need operator approval (R6 D18)"}
    mdev-lead-architect: {enabled: true, writes: true, path_scopes: ["src/ports/**"], task_kinds: [design, design_review], ref: "gen_agents.py 01 (ADR proposals under docs/** stay outside agent scope: restricted; see 26-… §2.3 Q-M3)"}
    mdev-tpm: {enabled: true, writes: false, path_scopes: [], task_kinds: [planning], ref: "gen_agents.py 02 (reports go to evidence only)"}
    mdev-backend-engineer: {enabled: true, writes: true, path_scopes: ["src/core/**", "src/app/**", "src/bin/**", "src/adapters/clock/**", "src/adapters/control/**", "src/adapters/notify/**", "src/adapters/fs/**", "test/**"], task_kinds: [implementation], ref: gen_agents.py 03}
    mdev-database-engineer: {enabled: true, writes: true, path_scopes: ["src/adapters/sqlite/**", "test/**"], task_kinds: [implementation], ref: gen_agents.py 04}
    mdev-ai-integration-engineer: {enabled: true, writes: true, path_scopes: ["src/adapters/claude/**", "src/adapters/codex/**", "src/schemas/**", "scripts/gen-wire-schemas.ts", "test/fakes/agents/**", "test/**"], task_kinds: [implementation], ref: gen_agents.py 05}
    mdev-platform-integration-engineer: {enabled: true, writes: true, path_scopes: ["src/adapters/github/**", "src/adapters/linear/**", "src/app/inbox-processor.ts", "src/app/outbox-worker.ts", "test/mocks/**", "test/**"], task_kinds: [implementation], ref: gen_agents.py 06}
    mdev-security-engineer: {enabled: true, writes: true, path_scopes: ["src/adapters/process/**", "src/adapters/git/**", "src/adapters/keychain/**", "src/adapters/presence/**", "packaging/agent/**", "src/core/policies/redaction*", "test/**"], task_kinds: [implementation, security_review], ref: gen_agents.py 07}
    mdev-devops-engineer: {enabled: true, writes: true, path_scopes: ["packaging/**", "package.json", "package-lock.json", "scripts/**"], task_kinds: [implementation, release], ref: "gen_agents.py 08 (image builds run in devplat CI, not in the cluster, doc 22 O-5; in-cluster builds are disabled by default, R6 D20) (excl. packaging/agent/**, scripts/gen-wire-schemas.ts — enforced by contracts). .github/workflows/** is in the v1 scope but restricted here until Q-M3 is answered"}
    mdev-test-automation-engineer: {enabled: true, writes: true, path_scopes: ["test/**"], task_kinds: [test], ref: gen_agents.py 09}
    mdev-reliability-engineer: {enabled: true, writes: true, path_scopes: ["test/recovery/**", "test/fault/**"], task_kinds: [reliability, reliability_review], ref: "gen_agents.py 10 (Mac procedures are mac_validation tasks of the operator lane, not of this role)"}
    mdev-code-reviewer: {enabled: true, writes: false, path_scopes: [], task_kinds: [code_review], ref: gen_agents.py 11}
    mdev-integration-release-engineer: {enabled: true, writes: true, path_scopes: ["CHANGELOG.md"], task_kinds: [integration, release], ref: "gen_agents.py 12 (integration branches are controller-created, never pushed)"}

review_gates:
  gates:
    G1: {required: true, verifier: devplat-controller (design refs on an approved commit + READY), ref: 08-… §1}
    G2: {required: true, verifier: devplat-controller re-run in a fresh Job at the recorded head, ref: 08-… §1}
    G3: {required: true, verifier: mdev-code-reviewer subtask bound to the tested head, ref: 08-… §1}
    G4: {required: true, verifier: mdev-security-engineer fresh instance, depth: "every full-lifecycle task (TDD DoD D6); full depth for security_sensitive", ref: 08-… §1}
    G5: {required: true, verifier: mdev-integration-release-engineer subtask; controller re-check, ref: 08-… §1}
    G6: {required: true, verifier: devplat-gitbroker push + draft PR + required CI green at the tested head, ref: 08-… §1}
    G7: {required: true, verifier: "GitHub fact: merged_by = repository owner, approving review on the G6 head", ref: 08-… §1}
  required_reviewers:
    default: [mdev-code-reviewer, mdev-security-engineer]
    security_sensitive: [mdev-code-reviewer, mdev-security-engineer]
    interface_changes: [mdev-code-reviewer, mdev-security-engineer, mdev-lead-architect]
    root_artefacts: [operator]        # DOD-06
  human_approvers: [usjbro]           # sole CODEOWNER (ADR-008; github.md §9.4 O2)
  human_approver_rule: repository_owner
