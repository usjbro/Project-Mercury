# devplat base: ServiceAccounts. Status: Documented only / not deployed.
# Every ServiceAccount sets automountServiceAccountToken: false. Only devplat-controller needs a Kubernetes API
# token; its Deployment opts in at pod level (audience-bound projected token). All other identities hold
# ZERO Kubernetes RBAC (doc 18 §4). The `default` ServiceAccount of each namespace is re-declared with
# automount disabled. Project identities: <id>-agent (agent, planner and verifier Jobs in proj-<id>-exec),
# <id>-build (proj-<id>-build); test Jobs use the namespace's `default` SA (token never mounted).
# PostgreSQL instance ServiceAccounts are created by the CloudNativePG operator (not here).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: devplat-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-controller
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-controller
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-api
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-api
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-gitbroker
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-gitbroker
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-model-gateway
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-model-gateway
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-registry-proxy
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-registry-proxy
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# Serves one-time source bundles to fetch init containers. Holds NO GitHub credential (doc 18 §5.2): it reads
# bundles prepared by devplat-gitbroker from the artifact store, so agent pods never reach the key-holding pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-gitbroker-fetch
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-gitbroker-fetch
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# Cluster-local resolver for project pods: CoreDNS with the kubernetes plugin only (no forward plugin), so DNS
# cannot be used as an exfiltration channel to the internet (doc 18 §6.2). Needs read-only API access (token opt-in).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-dns
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-dns
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# No pod runs as devplat-namespacer. The controller impersonates it (Role devplat-controller-impersonate-namespacer)
# for the only cluster-scoped writes the platform makes: create/delete ephemeral test namespaces proj-<P>-t-<runid>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-namespacer
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-namespacer
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: devplat-artifacts
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-artifacts
  namespace: devplat-artifacts
  labels:
    app.kubernetes.io/name: devplat-artifacts
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: devplat-observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-prometheus
  namespace: devplat-observability
  labels:
    app.kubernetes.io/name: devplat-prometheus
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
