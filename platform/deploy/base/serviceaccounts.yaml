# devplat base: ServiceAccounts. Status: Documented only / not deployed.
# Every ServiceAccount sets automountServiceAccountToken: false. Only devplat-controller needs a Kubernetes API
# token; its Deployment opts in at pod level (audience-bound projected token). All other identities hold
# ZERO Kubernetes RBAC (doc 18 §4). The `default` ServiceAccount of each namespace is re-declared with
# automount disabled. Project identities: <id>-agent (agent, planner and verifier Jobs in proj-<id>-exec),
# <id>-build (proj-<id>-build); test Jobs use the namespace's `default` SA (token never mounted).
# PostgreSQL instance ServiceAccounts are created by the CloudNativePG operator (not here).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: devplat-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-controller
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-controller
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-api
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-api
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-gitbroker
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-gitbroker
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-model-gateway
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-model-gateway
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# D14: one read-only package/OCI pull-through proxy PER PROJECT (publish/adduser disabled, upstream allowlist from
# that project's registries_allowlist). Pods of project mercury reach only this instance.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-registry-proxy-mercury
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-registry-proxy-mercury
    app.kubernetes.io/part-of: devplat
    devplat.io/project: mercury
automountServiceAccountToken: false
---
# D14: one read-only package/OCI pull-through proxy PER PROJECT (publish/adduser disabled, upstream allowlist from
# that project's registries_allowlist). Pods of project jupiter reach only this instance.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-registry-proxy-jupiter
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-registry-proxy-jupiter
    app.kubernetes.io/part-of: devplat
    devplat.io/project: jupiter
automountServiceAccountToken: false
---
# Serves one-time source bundles to fetch init containers. Holds NO GitHub credential (doc 18 §5.2): it reads
# bundles prepared by devplat-gitbroker from the artifact store, so agent pods never reach the key-holding pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-gitbroker-fetch
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-gitbroker-fetch
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# Cluster-local resolver for project pods: CoreDNS with the kubernetes plugin only (no forward plugin), so DNS
# cannot be used as an exfiltration channel to the internet (doc 18 §6.2). Needs read-only API access (token opt-in).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-dns
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-dns
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# D19: devplat-namespacer is a dedicated Deployment (chart `devplat`, port 8083, ingress only from the controller).
# It creates/deletes test namespaces proj-<P>-t-<8 hex> from a FIXED template; the controller sends only
# (project, runid, profile ref). Its pod opts in to an audience-bound token at pod level (the only cluster-scoped
# writer). Every write is checked by VAP devplat-namespacer-scope (names, labels, NetworkPolicy peers/ports,
# quota caps, RoleBinding shape, params ConfigMap content).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-namespacer
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-namespacer
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# D10: the ONLY artifact path for agent, build and test pods (:8082). Pods upload/download with a per-Job one-time
# token; the gateway writes runs/<job-uid>/... with its own S3 credential (Secret devplat-artifacts-artifact-gateway).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-artifact-gateway
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-artifact-gateway
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
# D9: Helm pre-install/pre-upgrade migration Job; the only login that owns/changes the schema
# (Secret devplat-db-migrator, pinned). The controller never migrates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-migrator
  namespace: devplat-system
  labels:
    app.kubernetes.io/name: devplat-migrator
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: devplat-artifacts
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-artifacts
  namespace: devplat-artifacts
  labels:
    app.kubernetes.io/name: devplat-artifacts
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: devplat-observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplat-prometheus
  namespace: devplat-observability
  labels:
    app.kubernetes.io/name: devplat-prometheus
    app.kubernetes.io/part-of: devplat
automountServiceAccountToken: false
