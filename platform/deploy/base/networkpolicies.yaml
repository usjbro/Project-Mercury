        matchLabels:
          kubernetes.io/metadata.name: devplat-artifacts
    ports:
    - protocol: TCP
      port: 9090
  - to:
    - ipBlock:
        cidr: 192.0.2.10/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
