metadata:
  name: prometheus
  namespace: devplat-observability
  annotations:
    devplat.io/purpose: Prometheus scrapes platform metrics ports only; never project
      namespaces.
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devplat-prometheus
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: devplat-grafana
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: devplat-system
