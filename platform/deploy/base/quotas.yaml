# devplat base: ResourceQuota + LimitRange per project namespace. Status: Documented only / not deployed.
# Backstop for the controller's admission (doc 18 §8, scheduling doc). Ephemeral test namespaces receive a
# quota/limit range from devplat-namespacer at creation (sized from the project config).
# services: "0" in exec/build: agents and builds never expose Services. Generic ephemeral volumes count as PVCs.
# RuntimeClass overhead (gVisor/Kata) is added to pod requests and therefore counts against these quotas.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devplat-compute
  namespace: proj-mercury-exec
  annotations:
    devplat.io/sizing: baseline; controller admission (global/project/role caps) is
      the primary limiter, quota is the backstop
spec:
  hard:
    requests.cpu: '8'
    limits.cpu: '16'
    requests.memory: 16Gi
    limits.memory: 32Gi
    requests.ephemeral-storage: 60Gi
    limits.ephemeral-storage: 120Gi
    pods: '8'
    count/jobs.batch: '40'
    persistentvolumeclaims: '8'
    requests.storage: 160Gi
    configmaps: '100'
    secrets: '100'
    services: '0'
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devplat-no-platform-priority
  namespace: proj-mercury-exec
  annotations:
    devplat.io/purpose: project workloads may not use the platform PriorityClass (pods
      hard 0 in that scope)
spec:
  hard:
    pods: '0'
  scopeSelector:
    matchExpressions:
    - scopeName: PriorityClass
      operator: In
      values:
      - devplat-platform
      - system-cluster-critical
      - system-node-critical
---
apiVersion: v1
kind: LimitRange
metadata:
  name: devplat-defaults
  namespace: proj-mercury-exec
spec:
  limits:
  - type: Container
    max:
      cpu: '4'
      memory: 8Gi
      ephemeral-storage: 20Gi
    min:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: '2'
      memory: 4Gi
      ephemeral-storage: 10Gi
    defaultRequest:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 2Gi
  - type: PersistentVolumeClaim
    max:
      storage: 20Gi
---
