# devplat base: ValidatingAdmissionPolicies (admissionregistration.k8s.io/v1, GA since v1.30).
# Status: Documented only / not deployed. CEL expressions were syntax-checked offline only (see doc 18 §13);
# they have NOT been evaluated by a kube-apiserver. Deploy first with validationActions [Warn, Audit] in a
# scratch cluster, confirm status.typeChecking is empty, then switch to [Deny, Audit].
# Design and rationale: docs/mercury/development-orchestration/18-kubernetes-security-model.md §10.
#
# Scope is by namespace label (devplat.io/managed, devplat.io/tier). Only the operator can change namespace labels
# (no devplat identity has namespaces update); devplat-namespacer-scope pins the labels of ephemeral namespaces.
# failurePolicy: Fail everywhere: a broken or unevaluable policy denies.
#
# Policies
#   devplat-pod-hardening            all managed namespaces: no host namespaces/paths/ports, privileged, added caps,
#                                    unmasked /proc, sysctls, ephemeral containers (covers the PSA "privileged" build tier)
#   devplat-proj-pod-identity        project tiers: no SA token, fixed SA per tier, volume type allowlist, only
#                                    per-run (dp-*) Secrets, no imagePullSecrets, labels match the namespace's project
#   devplat-proj-runtime-placement   project tiers: sandboxed RuntimeClass (exec/test); build: sandbox or build pool
#   devplat-platform-placement       platform tiers: may not tolerate the exec taint
#   devplat-build-exceptions         build tier: restricted-equivalent except named BuildKit exceptions
#   devplat-image-pinning            all managed namespaces: digest-pinned images from allowed prefixes (params)
#   devplat-job-shape                project tiers: Job invariants owned by the controller (backoffLimit 0, deadline,
#                                    TTL, labels, no manualSelector, single pod)
#   devplat-secret-pinning           devplat-system: each platform credential mountable only by its owner SA
#   devplat-namespacer-scope         every write by devplat-namespacer confined to proj-<P>-t-<runid>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devplat-admission-params
  namespace: devplat-system
  labels:
    app.kubernetes.io/part-of: devplat
  annotations:
    devplat.io/placeholder: "registry.example.invalid is a placeholder; the overlay sets the real registry/mirror prefixes"
data:
  # Comma-separated image reference prefixes. Every image must ALSO contain '@sha256:'.
  allowedImagePrefixes: "registry.example.invalid/devplat/,registry.example.invalid/projects/,registry.example.invalid/mirror/"
  # The only image that may run as the named container 'buildkitd' with the BuildKit exceptions.
  buildkitImagePrefix: "registry.example.invalid/mirror/moby/buildkit@sha256:"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-pod-hardening
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        devplat.io/managed: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork == false"
      message: "hostNetwork is forbidden in devplat namespaces."
    - expression: "!has(object.spec.hostPID) || object.spec.hostPID == false"
      message: "hostPID is forbidden in devplat namespaces."
    - expression: "!has(object.spec.hostIPC) || object.spec.hostIPC == false"
      message: "hostIPC is forbidden in devplat namespaces."
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: "hostPath volumes are forbidden (this includes docker.sock / containerd.sock mounts)."
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: "privileged containers are forbidden."
    - expression: "variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: "hostPort is forbidden."
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)"
      message: "adding Linux capabilities is forbidden."
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount) || c.securityContext.procMount == 'Default')"
      message: "procMount Unmasked is forbidden."
    - expression: "!has(object.spec.securityContext) || !has(object.spec.securityContext.sysctls) || size(object.spec.securityContext.sysctls) == 0"
      message: "pod sysctls are forbidden."
    - expression: "!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0"
      message: "ephemeral (debug) containers are forbidden; the operator debugs in a copy of the pod."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-pod-hardening
spec:
  policyName: devplat-pod-hardening
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-proj-pod-identity
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: devplat.io/managed
          operator: In
          values: ["true"]
        - key: devplat.io/tier
          operator: In
          values: ["exec", "build", "test"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: tier
      expression: "namespaceObject.metadata.labels['devplat.io/tier']"
    - name: allowedServiceAccounts
      expression: "{'exec': ['devplat-agent', 'devplat-planner'], 'build': ['devplat-build'], 'test': ['default']}"
    - name: allowedRoles
      expression: "{'exec': ['agent', 'planner'], 'build': ['build'], 'test': ['test', 'fixture']}"
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "project pods must set automountServiceAccountToken: false (no Kubernetes API credential in agent, build or test pods)."
    - expression: "object.spec.serviceAccountName in variables.allowedServiceAccounts[variables.tier]"
      message: "project pods must use the tier's zero-RBAC ServiceAccount."
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.serviceAccountToken)))"
      message: "projected ServiceAccount tokens are forbidden in project pods."
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || has(v.configMap) || has(v.secret) || has(v.projected) || has(v.downwardAPI) || has(v.ephemeral) || has(v.persistentVolumeClaim))"
      message: "project pods may only use emptyDir, configMap, secret, projected, downwardAPI, ephemeral and persistentVolumeClaim volumes."
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, (!has(v.secret) || (has(v.secret.secretName) && v.secret.secretName.startsWith('dp-'))) && (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret) || (has(s.secret.name) && s.secret.name.startsWith('dp-')))))"
      message: "project pods may mount only per-run Secrets (name prefix dp-)."
    - expression: "variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || (has(e.valueFrom.secretKeyRef.name) && e.valueFrom.secretKeyRef.name.startsWith('dp-')))) && (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef) || (has(f.secretRef.name) && f.secretRef.name.startsWith('dp-')))))"
      message: "project pods may reference only per-run Secrets (name prefix dp-) from env."
    - expression: "!has(object.spec.imagePullSecrets) || size(object.spec.imagePullSecrets) == 0"
      message: "imagePullSecrets are forbidden in project pods (images come from the node-authenticated mirror)."
    - expression: "'devplat.io/project' in variables.labels && 'devplat.io/project' in namespaceObject.metadata.labels && variables.labels['devplat.io/project'] == namespaceObject.metadata.labels['devplat.io/project']"
      message: "pod label devplat.io/project must equal the namespace's project."
    - expression: "'devplat.io/role' in variables.labels && variables.labels['devplat.io/role'] in variables.allowedRoles[variables.tier]"
      message: "pod label devplat.io/role must be one of the tier's roles."
    - expression: "!('devplat.io/network-class' in variables.labels) || variables.labels['devplat.io/network-class'] in ['none', 'deps']"
      message: "devplat.io/network-class must be none or deps."
    - expression: "!has(object.spec.shareProcessNamespace) || object.spec.shareProcessNamespace == false"
      message: "shareProcessNamespace is forbidden in project pods."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-proj-pod-identity
spec:
  policyName: devplat-proj-pod-identity
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-proj-runtime-placement
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: devplat.io/managed
          operator: In
          values: ["true"]
        - key: devplat.io/tier
          operator: In
          values: ["exec", "build", "test"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: tier
      expression: "namespaceObject.metadata.labels['devplat.io/tier']"
    - name: sandboxed
      expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName in ['gvisor', 'kata']"
    - name: onBuildPool
      expression: "has(object.spec.nodeSelector) && 'devplat.io/pool' in object.spec.nodeSelector && object.spec.nodeSelector['devplat.io/pool'] == 'build'"
  validations:
    - expression: "variables.tier == 'build' || variables.sandboxed"
      message: "agent, planner and test pods must use RuntimeClass gvisor or kata (exec node pool)."
    - expression: "variables.tier != 'build' || variables.sandboxed || variables.onBuildPool"
      message: "build pods must use RuntimeClass gvisor/kata or run on the dedicated build pool (nodeSelector devplat.io/pool=build)."
---
# Reduced-assurance (single-node workstation without gVisor/Kata): the workstation overlay changes ONLY this
# binding to validationActions [Warn, Audit] and the controller records assurance=reduced in every run's evidence.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-proj-runtime-placement
  annotations:
    devplat.io/reduced-assurance-overridable: "true"
spec:
  policyName: devplat-proj-runtime-placement
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-platform-placement
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: devplat.io/managed
          operator: In
          values: ["true"]
        - key: devplat.io/tier
          operator: In
          values: ["system", "artifacts", "observability"]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.tolerations) || object.spec.tolerations.all(t, (has(t.key) && t.key != 'devplat.io/exec' && t.key != 'devplat.io/build') || (!has(t.key) && (!has(t.operator) || t.operator != 'Exists')))"
      message: "platform pods may not tolerate the exec/build pool taints (no wildcard tolerations)."
    - expression: "!has(object.spec.runtimeClassName) || !(object.spec.runtimeClassName in ['gvisor', 'kata'])"
      message: "platform pods do not run on the exec pool."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-platform-placement
spec:
  policyName: devplat-platform-placement
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-build-exceptions
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchLabels:
        devplat.io/managed: "true"
        devplat.io/tier: build
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: podNonRoot
      expression: "has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot == true"
    - name: podSeccomp
      expression: "has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) ? object.spec.securityContext.seccompProfile.type : ''"
    - name: podAppArmor
      expression: "has(object.spec.securityContext) && has(object.spec.securityContext.appArmorProfile) ? object.spec.securityContext.appArmorProfile.type : ''"
    - name: buildkitPrefix
      expression: "params.data['buildkitImagePrefix']"
  validations:
    - expression: "variables.containers.all(c, c.name != 'buildkitd' || c.image.startsWith(variables.buildkitPrefix))"
      message: "the container name buildkitd (which carries the BuildKit exceptions) is reserved for the pinned BuildKit image."
    - expression: "variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.runAsNonRoot)) ? c.securityContext.runAsNonRoot == true : variables.podNonRoot)"
      message: "build containers must run as non-root (rootless BuildKit)."
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.runAsUser) || c.securityContext.runAsUser != 0) && (!has(object.spec.securityContext) || !has(object.spec.securityContext.runAsUser) || object.spec.securityContext.runAsUser != 0)"
      message: "runAsUser 0 is forbidden."
    - expression: "variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop)"
      message: "build containers must drop ALL capabilities."
    - expression: "variables.containers.all(c, ((has(c.securityContext) && has(c.securityContext.seccompProfile)) ? c.securityContext.seccompProfile.type : variables.podSeccomp) in ['RuntimeDefault', 'Localhost'] || (c.name == 'buildkitd' && ((has(c.securityContext) && has(c.securityContext.seccompProfile)) ? c.securityContext.seccompProfile.type : variables.podSeccomp) == 'Unconfined'))"
      message: "seccomp must be RuntimeDefault or Localhost; only buildkitd may be Unconfined (prefer the Localhost profile devplat-buildkit)."
    - expression: "variables.containers.all(c, ((has(c.securityContext) && has(c.securityContext.appArmorProfile)) ? c.securityContext.appArmorProfile.type : variables.podAppArmor) != 'Unconfined' || c.name == 'buildkitd')"
      message: "AppArmor Unconfined is allowed only for buildkitd."
    - expression: "!has(object.metadata.annotations) || object.metadata.annotations.all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/') || object.metadata.annotations[k] != 'unconfined' || k == 'container.apparmor.security.beta.kubernetes.io/buildkitd')"
      message: "legacy AppArmor unconfined annotation is allowed only for buildkitd."
    - expression: "variables.containers.all(c, c.name == 'buildkitd' || (has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false))"
      message: "allowPrivilegeEscalation must be false (only buildkitd may need it for newuidmap/newgidmap)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-build-exceptions
spec:
  policyName: devplat-build-exceptions
  paramRef:
    name: devplat-admission-params
    namespace: devplat-system
    parameterNotFoundAction: Deny
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-image-pinning
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchLabels:
        devplat.io/managed: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: prefixes
      expression: "params.data['allowedImagePrefixes'].split(',')"
  validations:
    - expression: "variables.containers.all(c, c.image.contains('@sha256:'))"
      message: "images must be pinned by digest (@sha256:...)."
    - expression: "variables.containers.all(c, variables.prefixes.exists(p, p != '' && c.image.startsWith(p)))"
      message: "images must come from an allowed registry prefix (ConfigMap devplat-system/devplat-admission-params)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-image-pinning
spec:
  policyName: devplat-image-pinning
  paramRef:
    name: devplat-admission-params
    namespace: devplat-system
    parameterNotFoundAction: Deny
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-job-shape
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: devplat.io/managed
          operator: In
          values: ["true"]
        - key: devplat.io/tier
          operator: In
          values: ["exec", "build", "test"]
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  variables:
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: podLabels
      expression: "has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {}"
    - name: required
      expression: "['devplat.io/project', 'devplat.io/task', 'devplat.io/attempt', 'devplat.io/role', 'devplat.io/idempotency-key']"
  validations:
    - expression: "object.metadata.name.matches('^dp-[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(object.metadata.name) <= 63"
      message: "Job names are deterministic dp-<project>-<task>-a<attempt> DNS-1123 labels of at most 63 characters."
    - expression: "has(object.spec.backoffLimit) && object.spec.backoffLimit == 0"
      message: "backoffLimit must be 0: retries are owned by the controller."
    - expression: "has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds > 0 && object.spec.activeDeadlineSeconds <= 86400"
      message: "activeDeadlineSeconds is required (at most 24h)."
    - expression: "has(object.spec.ttlSecondsAfterFinished)"
      message: "ttlSecondsAfterFinished is required."
    - expression: "!has(object.spec.manualSelector) || object.spec.manualSelector == false"
      message: "manualSelector is forbidden (a Job could adopt foreign pods)."
    - expression: "(!has(object.spec.parallelism) || object.spec.parallelism == 1) && (!has(object.spec.completions) || object.spec.completions == 1)"
      message: "one Job = one pod run."
    - expression: "variables.required.all(k, k in variables.labels && k in variables.podLabels && variables.labels[k] == variables.podLabels[k])"
      message: "Job and pod template must carry identical devplat.io/project, task, attempt, role and idempotency-key labels."
    - expression: "'devplat.io/project' in namespaceObject.metadata.labels && variables.labels['devplat.io/project'] == namespaceObject.metadata.labels['devplat.io/project']"
      message: "devplat.io/project must equal the namespace's project (no cross-project Jobs)."
    - expression: "has(object.spec.template.spec.automountServiceAccountToken) && object.spec.template.spec.automountServiceAccountToken == false"
      message: "pod template must set automountServiceAccountToken: false."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-job-shape
spec:
  policyName: devplat-job-shape
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-secret-pinning
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: devplat-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    # Secret name -> the only ServiceAccounts whose pods may reference it. Names are fixed by this base.
    - name: pinned
      expression: "{'devplat-gitbroker-github-app': ['devplat-gitbroker'], 'devplat-model-gateway-llm-keys': ['devplat-model-gateway'], 'devplat-db-controller': ['devplat-controller'], 'devplat-db-api': ['devplat-api'], 'devplat-artifacts-controller': ['devplat-controller'], 'devplat-artifacts-gitbroker': ['devplat-gitbroker'], 'devplat-artifacts-api': ['devplat-api'], 'devplat-oidc-client': ['devplat-api'], 'devplat-linear-token': ['devplat-api']}"
    - name: sa
      expression: "has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : 'default'"
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, (!has(v.secret) || !has(v.secret.secretName) || !(v.secret.secretName in variables.pinned) || variables.sa in variables.pinned[v.secret.secretName]) && (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret) || !has(s.secret.name) || !(s.secret.name in variables.pinned) || variables.sa in variables.pinned[s.secret.name])))"
      message: "a platform credential Secret may be mounted only by its owning ServiceAccount (doc 18 §5)."
    - expression: "variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || !has(e.valueFrom.secretKeyRef.name) || !(e.valueFrom.secretKeyRef.name in variables.pinned) || variables.sa in variables.pinned[e.valueFrom.secretKeyRef.name])) && (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef) || !has(f.secretRef.name) || !(f.secretRef.name in variables.pinned) || variables.sa in variables.pinned[f.secretRef.name])))"
      message: "a platform credential Secret may be referenced from env only by its owning ServiceAccount."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-secret-pinning
spec:
  policyName: devplat-secret-pinning
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-namespacer-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["namespaces"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["resourcequotas", "limitranges"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["networkpolicies"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: is-namespacer
      expression: "request.userInfo.username == 'system:serviceaccount:devplat-system:devplat-namespacer'"
  variables:
    - name: isNamespace
      expression: "request.kind.kind == 'Namespace'"
    - name: targetName
      expression: "variables.isNamespace ? (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name) : request.namespace"
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: "variables.targetName.matches('^proj-[a-z0-9]([a-z0-9]{0,18}[a-z0-9])?-t-[a-z0-9]{6,20}$')"
      message: "devplat-namespacer may act only on ephemeral test namespaces proj-<project>-t-<runid>."
    - expression: "!variables.isNamespace || request.operation != 'CREATE' || ('devplat.io/managed' in variables.newLabels && variables.newLabels['devplat.io/managed'] == 'true' && 'devplat.io/tier' in variables.newLabels && variables.newLabels['devplat.io/tier'] == 'test' && 'devplat.io/ephemeral' in variables.newLabels && variables.newLabels['devplat.io/ephemeral'] == 'true' && 'pod-security.kubernetes.io/enforce' in variables.newLabels && variables.newLabels['pod-security.kubernetes.io/enforce'] == 'restricted' && 'devplat.io/project' in variables.newLabels && variables.targetName.startsWith('proj-' + variables.newLabels['devplat.io/project'] + '-t-'))"
      message: "ephemeral namespaces must be created with devplat.io/managed=true, tier=test, ephemeral=true, PSA enforce=restricted and a devplat.io/project matching the name."
    - expression: "!variables.isNamespace || request.operation != 'DELETE' || (has(oldObject.metadata.labels) && 'devplat.io/ephemeral' in oldObject.metadata.labels && oldObject.metadata.labels['devplat.io/ephemeral'] == 'true')"
      message: "devplat-namespacer may delete only namespaces labelled devplat.io/ephemeral=true."
    - expression: "request.kind.kind != 'RoleBinding' || (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'devplat-test-runner' && has(object.subjects) && size(object.subjects) == 1 && object.subjects[0].kind == 'ServiceAccount' && object.subjects[0].name == 'devplat-controller' && has(object.subjects[0].namespace) && object.subjects[0].namespace == 'devplat-system')"
      message: "devplat-namespacer may only bind ClusterRole devplat-test-runner to the controller ServiceAccount."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-namespacer-scope
spec:
  policyName: devplat-namespacer-scope
  validationActions: ["Deny", "Audit"]
