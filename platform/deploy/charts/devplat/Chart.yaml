keywords: [devplat, ai-development-platform]
annotations:
  devplat.io/status: "Implemented (untested) - rendered and validated offline (24-... section 10), never installed"
  devplat.io/prerequisites: "platform/deploy/base cluster prerequisites (ClusterRoles, VAPs, RuntimeClasses, PriorityClasses, platform namespaces and NetworkPolicies); CloudNativePG operator (postgres.mode=cnpg); S3-compatible store"
