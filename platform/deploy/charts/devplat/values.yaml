# devplat control-plane values (proposed; Architecture Amendment 001).
# STATUS: no devplat images exist yet. Every image.digest is empty, and the templates `fail` until a real
# digest (sha256:<64 hex>) is supplied, e.g. ghcr.io/OWNER/devplat-controller@sha256:... .
# Images are always referenced by digest, never by tag. The admission params of platform/deploy/base
# (devplat-admission-params.allowedImagePrefixes) must list the chosen repository prefix.
#
# SECRETS are never values, and their NAMES are fixed by the security model (doc 18 section 8.1), because VAP
# devplat-secret-pinning pins each name to one ServiceAccount. The operator creates them out of band:
#   devplat-gitbroker-github-app   (keys: app-id, private-key.pem)       -> devplat-gitbroker
#   devplat-model-gateway-llm-keys (keys: <provider>-api-key)            -> devplat-model-gateway
#   devplat-db-controller | devplat-db-api | devplat-db-model-gateway (kubernetes.io/basic-auth)
#   devplat-artifacts-controller | -gitbroker | -gitbroker-fetch | -api (keys: access-key-id, secret-access-key)
#   devplat-oidc-client (key: client-secret), devplat-linear-token (key: token)  -> devplat-api
#
# PREREQUISITES from platform/deploy/base (installed by the operator first; see 24-... section 3):
# namespaces devplat-system / devplat-artifacts / devplat-observability, ClusterRoles devplat-job-runner,
# devplat-test-runner, devplat-namespacer (+ binding), devplat-dns (+ binding), PriorityClasses, RuntimeClasses,
# all ValidatingAdmissionPolicies with devplat-admission-params, and the NetworkPolicies of the platform
# namespaces. This chart renders none of them.

platform:
  # Logical cluster name used in execution targets {cluster_ref, namespace_prefix} (15-...).
  clusterRef: default
  # standard | reduced (25-deployment-profiles.md section 1). Recorded on every task event.
  assuranceMode: standard

# Node placement. Platform services run on the `control` pool. They never tolerate the exec/build taints
# (VAP devplat-platform-placement).
placement:
  control:
    nodeSelector:
      devplat.io/pool: control
    tolerations: []

image:
  pullPolicy: IfNotPresent
  pullSecrets: []

controller:
  replicas: 2
  image:
    repository: ghcr.io/OWNER/devplat-controller
    digest: ""            # sha256:... - placeholder, no image exists yet
  leaderElection:
    leaseDurationSeconds: 15
    renewDeadlineSeconds: 10
    retryPeriodSeconds: 2
  admission:
    globalMaxConcurrentJobs: 6
    defaultPerProjectMaxConcurrentJobs: 3
    testNamespaceTtlSeconds: 3600        # keep failed test namespaces this long for inspection
    maxTestNamespacesPerProject: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

api:
  replicas: 1
  image:
    repository: ghcr.io/OWNER/devplat-api
    digest: ""
  oidc:
    # Operator authentication (DOD-14). The client secret is in Secret devplat-oidc-client.
    issuerUrl: ""
    clientId: ""
    allowedSubjects: []   # OIDC `sub` values allowed to record operator facts
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

gitbroker:
  # Holds the development-bot GitHub App key (DOD-13). Ingress only from the controller.
  image:
    repository: ghcr.io/OWNER/devplat-gitbroker
    digest: ""
  # Fixed safety properties; the schema only accepts these values.
  pushRefPrefix: "dev/"
  draftPullRequestsOnly: true
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

gitbrokerFetch:
  # Serves one-time source bundles to fetch init containers on :8081. It holds NO GitHub key: it reads
  # prepared bundles from the artifact store (read-only on bundles/) and redeems one-time tokens.
  replicas: 2
  image:
    repository: ghcr.io/OWNER/devplat-gitbroker-fetch
    digest: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

modelGateway:
  replicas: 2
  image:
    repository: ghcr.io/OWNER/devplat-model-gateway
    digest: ""
  # Keys are read from Secret devplat-model-gateway-llm-keys, key "<name>-api-key".
  providers:
    - name: anthropic
      host: api.anthropic.com
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}

dns:
  # devplat-dns: CoreDNS with only the kubernetes plugin (no forward). Project pods use dnsPolicy: None with this
  # Service's ClusterIP (doc 18 section 9.4). Pod port 1053 (non-root), Service port 53.
  replicas: 2
  image:
    repository: registry.k8s.io/coredns/coredns
    digest: ""            # pin the operator-chosen CoreDNS release by digest
  clusterDomain: cluster.local
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}

postgres:
  # cnpg: create a CloudNativePG Cluster CR (operator must be installed first)
  # external: managed PostgreSQL; role credentials in the fixed devplat-db-* Secrets
  mode: cnpg
  cnpg:
    instances: 1          # 3 for multi-node profiles
    imageName: ""         # e.g. ghcr.io/cloudnative-pg/postgresql:16.x@sha256:... ; empty = operator default
    storage:
      size: 10Gi
      storageClass: ""
    backup:
      enabled: false      # not templated yet (24-... section 7)
  external:
    host: ""
    port: 5432
    database: devplat
    sslmode: verify-full

artifacts:
  # S3-compatible endpoint (external, or the in-cluster devplat-artifacts store installed separately).
  # MinIO community edition is archived (2026-04) - see 24-... section 3.
  endpoint: ""
  region: us-east-1
  bucketPrefix: devplat-

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""

serviceAccount:
  annotations: {}         # e.g. cloud workload identity per component (25-... section 6); applied to platform SAs only
