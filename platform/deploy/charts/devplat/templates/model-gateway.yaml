{{- /*
devplat-model-gateway: the only path from agent pods to LLM APIs (:8080, only for pods with network-class
model-only or deps, base NetworkPolicy). Per-Job tokens are minted on the admin port :9443 by the controller.
Provider keys: Secret devplat-model-gateway-llm-keys (key "<provider>-api-key"); budget tables: Secret
devplat-db-model-gateway. Host allowlist = the providers below.
*/}}
{{- $env := "" -}}
{{- $items := "" -}}
{{- range $i, $p := .Values.modelGateway.providers -}}
{{- $env = printf "%s- name: DEVPLAT_PROVIDER_%d_NAME\n  value: %q\n- name: DEVPLAT_PROVIDER_%d_HOST\n  value: %q\n- name: DEVPLAT_PROVIDER_%d_KEY_FILE\n  value: \"/var/run/devplat/llm-keys/%s-api-key\"\n" $env $i $p.name $i $p.host $i $p.name -}}
{{- $items = printf "%s      - key: %s-api-key\n        path: %s-api-key\n" $items $p.name $p.name -}}
{{- end -}}
{{- $env = printf "%s%s" $env (include "devplat.dbEnv" (dict "root" . "role" "model-gateway")) -}}
{{- $vols := printf "- name: llm-keys\n  secret:\n    secretName: devplat-model-gateway-llm-keys\n    defaultMode: 0400\n    items:\n%s" (trimSuffix "\n" $items) -}}
{{- $mounts := "- name: llm-keys\n  mountPath: /var/run/devplat/llm-keys\n  readOnly: true" -}}
{{ include "devplat.workload" (dict "root" . "name" "devplat-model-gateway" "key" "modelGateway" "comp" .Values.modelGateway "replicas" .Values.modelGateway.replicas
    "ports" (list (dict "name" "http" "containerPort" 8080 "servicePort" 8080) (dict "name" "admin" "containerPort" 9443 "servicePort" 9443) (dict "name" "metrics" "containerPort" 9090 "servicePort" 9090))
    "probe" (dict "readyPath" "/readyz" "livePath" "/healthz" "port" "http")
    "env" $env "automount" false "volumes" $vols "volumeMounts" $mounts "args" "") }}
