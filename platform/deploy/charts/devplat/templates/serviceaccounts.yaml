{{- include "devplat.assert" . }}
{{- /*
ServiceAccounts in devplat-system (names as in platform/deploy/base/serviceaccounts.yaml and doc 18 section 7).
Every ServiceAccount sets automountServiceAccountToken: false (as in base). Only the controller (writes Jobs) and
devplat-dns (read-only discovery) opt in at pod level in their Deployments.
The `default` ServiceAccount of devplat-system is re-declared by the base (namespace prerequisite), not here.
devplat-namespacer is never mounted by any pod: the controller impersonates it to create test namespaces.
*/}}
{{- $sas := list "devplat-controller" "devplat-api" "devplat-gitbroker" "devplat-gitbroker-fetch" "devplat-model-gateway" "devplat-dns" "devplat-namespacer" }}
{{- range $name := $sas }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "devplat.labels" (dict "root" $ "name" $name) | nindent 4 }}
  {{- if and $.Values.serviceAccount.annotations (has $name (list "devplat-controller" "devplat-api" "devplat-gitbroker" "devplat-gitbroker-fetch" "devplat-model-gateway")) }}
  annotations:
    {{- toYaml $.Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
