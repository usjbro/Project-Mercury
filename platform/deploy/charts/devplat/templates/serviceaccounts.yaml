{{- include "devplat.assert" . }}
{{- /*
ServiceAccounts in devplat-system (names as in platform/deploy/base/serviceaccounts.yaml and doc 18 section 7).
Every ServiceAccount sets automountServiceAccountToken: false (as in base). The controller (writes Jobs), the
namespacer (creates test namespaces) and devplat-dns (read-only discovery) opt in at pod level.
The migrator ServiceAccount is a hook resource (migrator-job.yaml), because it must exist before pre-install.
Annotations are per component (S-24); there is no shared map. The `default` ServiceAccount of devplat-system is
re-declared by the base (namespace prerequisite), not here.
*/}}
{{- $sas := list
  (dict "name" "devplat-controller" "key" "controller")
  (dict "name" "devplat-api" "key" "api")
  (dict "name" "devplat-gitbroker" "key" "gitbroker")
  (dict "name" "devplat-gitbroker-fetch" "key" "gitbrokerFetch")
  (dict "name" "devplat-artifact-gateway" "key" "artifactGateway")
  (dict "name" "devplat-model-gateway" "key" "modelGateway")
  (dict "name" "devplat-namespacer" "key" "")
  (dict "name" "devplat-dns" "key" "") }}
{{- range $sa := $sas }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "devplat.labels" (dict "root" $ "name" $sa.name) | nindent 4 }}
  {{- if $sa.key }}
  {{- include "devplat.saAnnotations" (dict "annotations" (index $.Values $sa.key).serviceAccountAnnotations) | nindent 2 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
