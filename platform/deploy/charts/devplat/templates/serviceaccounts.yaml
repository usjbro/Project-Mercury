{{- include "devplat.assertAssurance" . }}
{{- /* One ServiceAccount per component. Only the controller talks to the Kubernetes API, so only its token is mounted. */}}
{{- range $name, $automount := dict "devplat-controller" true "devplat-api" false "devplat-gitbroker" false "devplat-model-gateway" false }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "devplat.labels" (dict "root" $ "name" $name) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $automount }}
{{- end }}
