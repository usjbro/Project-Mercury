apiVersion: v2
name: devplat-project
description: >-
  Per-project namespace layer for devplat (same objects as platform/deploy/base renders statically for
  proj-mercury-* / proj-jupiter-*): namespaces (PSA pinned v1.33), ResourceQuotas, LimitRanges, zero-RBAC
  ServiceAccounts, the controller's RoleBindings to devplat-job-runner, NetworkPolicies, project-specific
  admission (builder allowlist, optional RuntimeClass pin) and the test-namespace profile applied by
  devplat-namespacer. Values are generated from the project configuration (26-...). Proposed; never installed.
type: application
version: 0.1.0-alpha.0
appVersion: "0.1.0-alpha.0"
kubeVersion: ">=1.30.0-0"
annotations:
  devplat.io/status: "Implemented (untested) - rendered, validated and compared with platform/deploy/base offline, never installed"
  devplat.io/requires: "devplat chart installed (platformNamespace) with a matching version"
