{{- /*
Project-specific admission ONLY (doc 18 section 15 ownership split, I-6). Generic hardening, ServiceAccount, token,
volume, Secret-name, network-class and generic gVisor/Kata placement rules are base VAPs and are not repeated here.
Rendered:
- devplat-<P>-builder-allowlist: every container in this project's build namespace runs an allowlisted builder image
  (empty list = no build pod admitted);
- devplat-<P>-runtime-class: only when exec.requiredRuntimeClassName pins ONE sandbox class for this project.
*/}}
{{- $id := .Values.project.id }}
{{- if .Values.build.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-{{ $id }}-builder-allowlist
  labels:
    {{- include "proj.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        devplat.io/project: {{ $id }}
        devplat.io/ns-role: build
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: allowed
      expression: "[{{ range $i, $img := .Values.build.allowedBuilderImages }}{{ if $i }}, {{ end }}'{{ $img }}'{{ end }}]"
  validations:
    - expression: "variables.containers.all(c, c.image in variables.allowed)"
      message: "build pods of project {{ $id }} may only run its allowlisted builder images (pinned by digest)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-{{ $id }}-builder-allowlist
  labels:
    {{- include "proj.labels" . | nindent 4 }}
spec:
  policyName: devplat-{{ $id }}-builder-allowlist
  validationActions: ["Deny", "Audit"]
{{- end }}
{{- with .Values.exec.requiredRuntimeClassName }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: devplat-{{ $id }}-runtime-class
  labels:
    {{- include "proj.labels" $ | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - {key: devplat.io/project, operator: In, values: ["{{ $id }}"]}
        - {key: devplat.io/ns-role, operator: In, values: ["exec", "test"]}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == '{{ . }}'"
      message: "project {{ $id }} pins RuntimeClass {{ . }} for exec and test pods"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: devplat-{{ $id }}-runtime-class
  labels:
    {{- include "proj.labels" $ | nindent 4 }}
spec:
  policyName: devplat-{{ $id }}-runtime-class
  validationActions: ["Deny", "Audit"]
{{- end }}
