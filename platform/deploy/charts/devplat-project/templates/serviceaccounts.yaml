{{- /* Zero-RBAC ServiceAccounts: no Role or RoleBinding references them, and tokens are never mounted. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.project.id }}-agent
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "exec") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.build.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.project.id }}-build
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "build") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
