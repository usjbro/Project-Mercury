{{- /* Zero-RBAC ServiceAccounts <P>-agent (exec) and <P>-build (build), token never mounted. Test namespaces use
their `default` SA. Pod-level automountServiceAccountToken: false is enforced by base VAP devplat-proj-pod-identity,
so the auto-created `default` SAs are not re-declared here (Helm cannot own them). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.project.id }}-agent
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "exec") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.project.id }}-build
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "build") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
automountServiceAccountToken: false
