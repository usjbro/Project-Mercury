{{- include "proj.assert" . }}
{{- /* Persistent project namespaces (same labels as platform/deploy/base/namespaces.yaml). Ephemeral
proj-<P>-t-<8 hex> namespaces are created by devplat-namespacer from test-profile.yaml, never by this chart. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "proj.ns" (dict "Values" .Values "role" "exec") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
    devplat.io/ns-role: exec
    {{- include "proj.psa" (dict "enforce" "restricted") | nindent 4 }}
---
# Build namespace (always present, as in base; builds run only when the params switch buildsEnabled is "true",
# D20). PSA enforce "privileged" ONLY because rootless BuildKit needs exceptions (Unconfined or Localhost
# seccomp/AppArmor, newuidmap) that Baseline/Restricted cannot express; audit/warn stay restricted. The real
# controls are the base VAPs (devplat-pod-hardening, -proj-pod-identity, -build-exceptions,
# -proj-runtime-placement, -image-pinning) plus this chart's builder allowlist (doc 18 section 10.1).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "proj.ns" (dict "Values" .Values "role" "build") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
    devplat.io/ns-role: build
    {{- include "proj.psa" (dict "enforce" "privileged") | nindent 4 }}
