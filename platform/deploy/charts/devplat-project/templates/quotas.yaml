apiVersion: v1
kind: ResourceQuota
metadata:
  name: devplat-quota
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "exec") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
spec:
  {{- include "proj.quota" .Values.exec.quota | nindent 2 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: devplat-limits
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "exec") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.exec.limits.defaultCpu | quote }}
        memory: {{ .Values.exec.limits.defaultMemory | quote }}
      defaultRequest:
        cpu: {{ .Values.exec.limits.defaultRequestCpu | quote }}
        memory: {{ .Values.exec.limits.defaultRequestMemory | quote }}
      max:
        cpu: {{ .Values.exec.limits.maxCpu | quote }}
        memory: {{ .Values.exec.limits.maxMemory | quote }}
{{- if .Values.build.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devplat-quota
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "build") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
spec:
  {{- include "proj.quota" .Values.build.quota | nindent 2 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: devplat-limits
  namespace: {{ include "proj.ns" (dict "Values" .Values "role" "build") }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: "1"
        memory: 2Gi
{{- end }}
