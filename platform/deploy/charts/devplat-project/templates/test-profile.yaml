{{- /*
Test-namespace profile read by devplat-controller. For every integration/e2e run the controller, impersonating
devplat-namespacer (VAP devplat-namespacer-scope), creates proj-<P>-t-<8 hex> with these labels, quota, LimitRange,
the NetworkPolicies of doc 18 section 9.3 and a RoleBinding controller -> devplat-test-runner; runs the test Jobs
(SA `default`, token off, dnsPolicy None with devplat-dns); collects evidence; deletes the namespace after the TTL.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: devplat-test-profile-{{ .Values.project.id }}
  namespace: {{ .Values.platformNamespace }}
  labels:
    {{- include "proj.labels" . | nindent 4 }}
    devplat.io/config: test-profile
data:
  profile.yaml: |
    project: {{ .Values.project.id }}
    namespaceNamePattern: "^{{ .Values.project.namespacePrefix }}-t-[0-9a-f]{8}$"
    createdBy: system:serviceaccount:{{ .Values.platformNamespace }}:devplat-namespacer
    namespaceLabels:
      devplat.io/project: {{ .Values.project.id }}
      devplat.io/ns-role: test
      devplat.io/managed-by: devplat-controller
      {{- include "proj.psa" (dict "enforce" "restricted") | nindent 6 }}
    serviceAccount: default
    pod:
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsNameserverService: {{ .Values.platformNamespace }}/devplat-dns
    maxConcurrentNamespaces: {{ .Values.test.maxConcurrentNamespaces }}
    ttlSecondsAfterSuccess: {{ .Values.test.ttlSecondsAfterSuccess }}
    ttlSecondsAfterFailure: {{ .Values.test.ttlSecondsAfterFailure }}
    maxLifetimeSeconds: {{ .Values.test.maxLifetimeSeconds }}
    resourceQuota:
      {{- include "proj.quota" .Values.test.quota | nindent 6 }}
    roleBinding:
      clusterRole: devplat-test-runner
      subject: {{ .Values.platformNamespace }}/devplat-controller
    networkPolicies:
      - default-deny-all
      - allow-intra-namespace
      - allow-devplat-dns
      - allow-fetch-and-artifacts      # gitbroker-fetch 8081 + artifact store
      - allow-deps                     # registry-proxy 4873, network-class deps only
      # never: model-gateway, gitbroker, PostgreSQL, kube-apiserver, kube-dns, internet
    sandboxEgress:
      enabled: {{ .Values.test.sandboxEgress.enabled }}
      egressCidrs: {{ toJson .Values.test.sandboxEgress.egressCidrs }}
