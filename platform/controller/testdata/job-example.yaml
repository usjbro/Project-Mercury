apiVersion: batch/v1
kind: Job
metadata:
  name: dp-mercury-dt-0001-a2-d1                 # dp-<project>-<task>-a<attempt>-d<dispatch>; deterministic => create is idempotent
  namespace: proj-mercury-exec                # from the project's execution target {cluster_ref, namespace_prefix}
  labels:
