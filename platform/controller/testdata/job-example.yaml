        options:
          - {name: ndots, value: "5"}
      runtimeClassName: gvisor                # 'default' only in reduced-assurance workstation mode
      priorityClassName: devplat-agent
      terminationGracePeriodSeconds: 60
      nodeSelector:
        devplat.io/pool: exec
      tolerations:
        - key: devplat.io/exec
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
